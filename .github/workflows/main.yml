name: Build VIGOLauncher APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build VIGOLauncher
    runs-on: ubuntu-24.04

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # GRADLE 8.10.2
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'


      # ==========================================
      # ANDROID SDK
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      # ==========================================
      # CHECK VIGOLAUNCHER
      # ==========================================

      - name: Check source files
        run: |
          echo "======================================"
          echo "VIGOLauncher source"
          echo "======================================"

          echo ""
          echo "Repository:"
          ls -la

          echo ""

          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html tidak ditemukan!"
            exit 1
          fi

          echo "OK: index.html ditemukan."


      # ==========================================
      # CREATE ANDROID PROJECT
      # ==========================================

      - name: Create Android project
        shell: bash
        run: |

          set -e

          mkdir -p android/app/src/main/java/com/vigolaucher/app
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/assets


          # --------------------------------------
          # settings.gradle
          # --------------------------------------

          cat > android/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VIGOLauncher"

          include(":app")
          EOF


          # --------------------------------------
          # build.gradle
          # --------------------------------------

          cat > android/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF


          # --------------------------------------
          # gradle.properties
          # --------------------------------------

          cat > android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF


          # --------------------------------------
          # app/build.gradle
          # --------------------------------------

          cat > android/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.vigolaucher.app'

              compileSdk 35

              defaultConfig {
                  applicationId 'com.vigolaucher.app'

                  minSdk 24

                  targetSdk 35

                  versionCode 1

                  versionName '1.0.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF


          # ======================================
          # COPY WEBSITE TO ANDROID ASSETS
          # ======================================

          echo "Copying VIGOLauncher files..."

          cp index.html android/app/src/main/assets/index.html


          if [ -f "styles.css" ]; then
              cp styles.css android/app/src/main/assets/styles.css
          fi


          if [ -f "main.js" ]; then
              cp main.js android/app/src/main/assets/main.js
          fi


          if [ -f "app.js" ]; then
              cp app.js android/app/src/main/assets/app.js
          fi


          # Copy JavaScript files
          find . -maxdepth 1 -type f -name "*.js" \
            -exec cp {} android/app/src/main/assets/ \;


          # Copy icon if available
          if [ -f "icon.svg" ]; then
              cp icon.svg android/app/src/main/assets/icon.svg
          fi


          echo ""
          echo "Assets:"
          ls -la android/app/src/main/assets


          # ======================================
          # STRINGS
          # ======================================

          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>
              <string name="app_name">VIGOLauncher</string>
          </resources>
          EOF


          # ======================================
          # THEME
          # ======================================

          cat > android/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="Theme.VIGOLauncher"
                  parent="@android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowActionModeOverlay">true</item>

                  <item name="android:windowNoTitle">true</item>

                  <item name="android:statusBarColor">#0B0F14</item>

                  <item name="android:navigationBarColor">#0B0F14</item>

                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF


          # ======================================
          # ANDROID MANIFEST
          # ======================================

          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.VIGOLauncher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          # ======================================
          # MAIN ACTIVITY
          # ======================================

          cat > android/app/src/main/java/com/vigolaucher/app/MainActivity.java <<'EOF'
          package com.vigolaucher.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {

                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);

                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);

                  settings.setDomStorageEnabled(true);

                  settings.setDatabaseEnabled(true);

                  settings.setAllowFileAccess(true);

                  settings.setAllowContentAccess(true);

                  settings.setLoadsImagesAutomatically(true);

                  settings.setBuiltInZoomControls(false);

                  settings.setDisplayZoomControls(false);

                  webView.setWebViewClient(
                      new WebViewClient()
                  );

                  webView.setWebChromeClient(
                      new WebChromeClient()
                  );

                  webView.loadUrl(
                      "file:///android_asset/index.html"
                  );
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }
              }

              @Override
              protected void onDestroy() {

                  if (webView != null) {

                      webView.destroy();

                      webView = null;
                  }

                  super.onDestroy();
              }
          }
          EOF


      # ==========================================
      # BUILD APK
      # ==========================================

      - name: Build Release APK
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Building VIGOLauncher APK"
          echo "======================================"

          gradle assembleRelease \
            --no-daemon \
            --stacktrace

          echo ""
          echo "Build selesai."


      # ==========================================
      # VERIFY APK
      # ==========================================

      - name: Verify APK
        shell: bash
        run: |

          echo "======================================"
          echo "Mencari APK"
          echo "======================================"

          find android/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then

              echo ""
              echo "ERROR: APK tidak ditemukan!"
              echo ""

              echo "Isi outputs:"
              find android/app/build/outputs \
                -maxdepth 10 \
                -type f \
                -print || true

              exit 1
          fi

          echo ""
          echo "APK ditemukan:"
          ls -lh "$APK"


      # ==========================================
      # COPY APK
      # ==========================================

      - name: Prepare APK
        shell: bash
        run: |

          set -e

          mkdir -p output

          cp \
            android/app/build/outputs/apk/release/app-release.apk \
            output/VIGOLauncher.apk

          echo ""
          echo "APK siap:"
          ls -lh output/VIGOLauncher.apk


      # ==========================================
      # UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIGOLauncher-APK
          path: output/VIGOLauncher.apk
          if-no-files-found: error
